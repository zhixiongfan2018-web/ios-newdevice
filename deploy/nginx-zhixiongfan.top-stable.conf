# IMPORTANT: Until this location is live, https://zhixiongfan.top/stable
# 302-redirects to /dial/ and Sileo will TIME OUT / fail to add the source.
# Use https://zhixiongfan2018-web.github.io/ios-newdevice until then.
#
# Paste into the zhixiongfan.top server nginx site config, THEN:
#   sudo nginx -t && sudo systemctl reload nginx
# Verify (must be Packages text, NOT HTML / Dial):
#   curl -sSI https://zhixiongfan.top/stable/Packages
#   curl -sS  https://zhixiongfan.top/stable/Packages | head
#
# Sileo source after nginx is live:
#   https://zhixiongfan.top/stable
#
# Proxies /stable/* → GitHub master/stable (no jsDelivr cache).

location ^~ /stable/ {
    proxy_pass https://raw.githubusercontent.com/zhixiongfan2018-web/ios-newdevice/master/stable/;
    proxy_ssl_server_name on;
    proxy_set_header Host raw.githubusercontent.com;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    # Apt clients expect plain files, not GitHub's download disposition
    proxy_hide_header Content-Disposition;
    proxy_hide_header X-Frame-Options;

    # Short cache so Sileo refresh sees new Packages quickly
    proxy_cache_valid 200 60s;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Sileo-Source "zhixiongfan.top/stable" always;
}

# Optional exact paths without trailing slash
location = /stable {
    return 301 /stable/;
}
