name: Deploy apt to GitHub Pages

on:
  workflow_dispatch:
  # GITHUB_TOKEN commits from Build NewDevice do not trigger path-filter pushes;
  # auto-deploy after a successful build so Sileo Pages stay current.
  workflow_run:
    workflows: ["Build NewDevice deb"]
    types: [completed]
    branches: [master]
  push:
    branches:
      - master
    paths:
      - "stable/**"
      - "apt/**"
      - ".github/workflows/deploy-apt-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-apt
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checkout defaults to the workflow file commit; always take latest master Packages.
          ref: master

      # Prefer stable/ (Sileo URL without @). Fall back to apt/ mirror.
      - name: Prepare site from stable/
        run: |
          set -euo pipefail
          rm -rf site
          if [ -f stable/Packages ] && [ -d stable/debs ]; then
            cp -a stable site
          else
            cp -a apt site
          fi
          # Never ship compressed indexes (CDN/Sileo ghosts)
          rm -f site/Packages.gz site/Packages.bz2 site/Packages.xz site/Packages.lzma site/Packages.zst
          test -f site/Release
          test -f site/Packages
          # Any current deb is fine (version bumps often)
          ls site/debs/com.local.newdevice_*.deb | head -n1 | grep -q .
          grep -q 'Architectures:' site/Release
          # Landing copy without @ in URL
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>NewDevice</title></head>
          <body>
            <h1>NewDevice</h1>
            <p>Sileo 源（无 @）：</p>
            <p><code>https://zhixiongfan2018-web.github.io/ios-newdevice/</code></p>
          </body>
          </html>
          HTML
          ls -la site site/debs
          echo "----- Release -----"
          cat site/Release
          echo "----- Packages -----"
          cat site/Packages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
