name: Build NewDevice deb

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-newdevice/**"
      - ".github/workflows/build-deb.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Theos + SDKs
        run: |
          set -euo pipefail
          rm -rf "$HOME/theos"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          # Theos ships an empty/placeholder sdks dir; replace with real SDKs
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          ls "$HOME/theos/sdks" | head
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install ldid
        run: |
          brew install ldid
          which ldid
          ldid 2>&1 | head -n 2 || true

      - name: Make package
        working-directory: ios-newdevice
        run: |
          set -euo pipefail
          export THEOS="${THEOS:-$HOME/theos}"
          export THEOS_PACKAGE_SCHEME=rootless
          make clean || true
          make package FINALPACKAGE=1 PACKAGE_VERSION=1.0.0-${{ github.run_number }}

      - name: Collect deb
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          files=(ios-newdevice/packages/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No deb produced"
            find ios-newdevice -maxdepth 4 -type f | head -n 300
            exit 1
          fi
          cp "${files[@]}" dist/
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewDevice-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
