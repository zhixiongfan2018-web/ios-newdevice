name: Build NewDevice deb

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-newdevice/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: write

concurrency:
  group: build-deb
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Theos + SDKs
        run: |
          set -euo pipefail
          rm -rf "$HOME/theos"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          # Theos ships an empty/placeholder sdks dir; replace with real SDKs
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          ls "$HOME/theos/sdks" | head
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install ldid + dpkg
        run: |
          brew install ldid dpkg
          which ldid
          which dpkg-scanpackages

      - name: Make package
        working-directory: ios-newdevice
        run: |
          set -euo pipefail
          export THEOS="${THEOS:-$HOME/theos}"
          export THEOS_PACKAGE_SCHEME=rootless
          # Windows checkout often loses +x; dpkg requires maintainer scripts executable
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/prerm
          make clean || true
          make package FINALPACKAGE=1 PACKAGE_VERSION=1.0.0-${{ github.run_number }}

      - name: Collect deb
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          files=(ios-newdevice/packages/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No deb produced"
            find ios-newdevice -maxdepth 4 -type f | head -n 300
            exit 1
          fi
          cp "${files[@]}" dist/
          ls -la dist
          echo "deb=$(ls dist/*.deb | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewDevice-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Publish deb to downloads/ (raw.githubusercontent.com)
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          mkdir -p downloads
          rm -f downloads/com.local.newdevice_*.deb downloads/NewDevice.deb
          DEB="$(ls dist/*.deb | head -n1)"
          cp "$DEB" downloads/
          cp "$DEB" downloads/NewDevice.deb
          ls -la downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/*.deb
          if git diff --cached --quiet; then
            echo "downloads/ already up to date"
            exit 0
          fi
          git commit -m "Update downloads deb for raw.githubusercontent.com [skip ci]"
          git push origin "HEAD:master"

      - name: Build Sileo apt repo
        run: |
          set -euo pipefail
          REPO_ROOT="$PWD/sileo-site"
          mkdir -p "$REPO_ROOT/debs"
          cp dist/*.deb "$REPO_ROOT/debs/"

          # Plain Packages only — do NOT publish Packages.gz/bz2 (CDN ghosts break Sileo)
          (
            cd "$REPO_ROOT"
            dpkg-scanpackages -m debs /dev/null > Packages
          )
          python3 - "$REPO_ROOT" <<'PY'
          import hashlib, datetime, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          pkg = (root / "Packages").read_bytes()
          size = len(pkg)
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")
          (root / "Release").write_text(
              f"Date: {now}\n"
              "Origin: NewDevice\n"
              "Label: NewDevice\n"
              "Suite: stable\n"
              "Version: 1.0\n"
              "Codename: stable\n"
              "Architectures: iphoneos-arm64\n"
              "Components: main\n"
              "Description: NewDevice Sileo source\n"
              f"MD5Sum:\n {hashlib.md5(pkg).hexdigest()} {size} Packages\n"
              f"SHA1:\n {hashlib.sha1(pkg).hexdigest()} {size} Packages\n"
              f"SHA256:\n {hashlib.sha256(pkg).hexdigest()} {size} Packages\n"
          )
          PY

          DEB_NAME=$(basename "$(ls dist/*.deb | head -n1)")
          cat > "$REPO_ROOT/index.html" <<HTML
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>NewDevice Sileo Source</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 2rem; line-height: 1.5; max-width: 40rem; }
              code, a { word-break: break-all; }
              .box { background: #f4f6f8; padding: 1rem 1.2rem; border-radius: 12px; }
            </style>
          </head>
          <body>
            <h1>NewDevice</h1>
            <p>推荐直链（raw，手机浏览器可下）：</p>
            <p class="box"><code>https://raw.githubusercontent.com/zhixiongfan2018-web/ios-newdevice/master/downloads/NewDevice.deb</code></p>
            <p>Sileo 固定源：</p>
            <p class="box"><code>https://zhixiongfan2018-web.github.io/ios-newdevice/</code></p>
            <p>本页 deb：<a href="debs/${DEB_NAME}">${DEB_NAME}</a></p>
          </body>
          </html>
          HTML
          # Remove YAML-style leading indentation from generated HTML
          python3 -c "from pathlib import Path; p=Path('sileo-site/index.html'); p.write_text('\n'.join(l[2:] if l.startswith('  ') else l for l in p.read_text().splitlines())+'\n', encoding='utf-8')"

          ls -la "$REPO_ROOT" "$REPO_ROOT/debs"
          echo "----- Packages (head) -----"
          head -n 30 "$REPO_ROOT/Packages"
          echo "----- Release -----"
          cat "$REPO_ROOT/Release"

      - name: Upload Sileo site artifact
        uses: actions/upload-artifact@v4
        with:
          name: sileo-site
          path: sileo-site
          if-no-files-found: error
          retention-days: 14
