name: Build NewDevice deb

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-newdevice/**"
      - ".github/workflows/build-deb.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deb
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Theos + SDKs
        run: |
          set -euo pipefail
          rm -rf "$HOME/theos"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          # Theos ships an empty/placeholder sdks dir; replace with real SDKs
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          ls "$HOME/theos/sdks" | head
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install ldid + dpkg
        run: |
          brew install ldid dpkg
          which ldid
          which dpkg-scanpackages

      - name: Make package
        working-directory: ios-newdevice
        run: |
          set -euo pipefail
          export THEOS="${THEOS:-$HOME/theos}"
          export THEOS_PACKAGE_SCHEME=rootless
          # Windows checkout often loses +x; dpkg requires maintainer scripts executable
          chmod 755 layout/DEBIAN/postinst layout/DEBIAN/prerm
          make clean || true
          make package FINALPACKAGE=1 PACKAGE_VERSION=1.0.0-${{ github.run_number }}

      - name: Collect deb
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          files=(ios-newdevice/packages/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No deb produced"
            find ios-newdevice -maxdepth 4 -type f | head -n 300
            exit 1
          fi
          cp "${files[@]}" dist/
          ls -la dist
          echo "deb=$(ls dist/*.deb | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewDevice-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Repack deb as data.tar.gz (iOS dpkg compatible)
        run: |
          set -euo pipefail
          DEB="$(ls dist/*.deb | head -n1)"
          rm -rf /tmp/nd-repack && mkdir -p /tmp/nd-repack
          dpkg-deb -x "$DEB" /tmp/nd-repack
          dpkg-deb -e "$DEB" /tmp/nd-repack/DEBIAN
          chmod 755 /tmp/nd-repack/DEBIAN/postinst /tmp/nd-repack/DEBIAN/prerm || true
          # Ensure no firmware Depends
          if grep -qi '^Depends:' /tmp/nd-repack/DEBIAN/control; then
            grep -vi '^Depends:' /tmp/nd-repack/DEBIAN/control > /tmp/nd-repack/DEBIAN/control.new
            mv /tmp/nd-repack/DEBIAN/control.new /tmp/nd-repack/DEBIAN/control
          fi
          OUT="dist/$(basename "$DEB")"
          dpkg-deb -Zgzip -b /tmp/nd-repack "$OUT.new"
          mv "$OUT.new" "$OUT"
          ar t "$OUT"
          dpkg-deb -I "$OUT" | head -n 25

      # Sileo URL is .../stable — publish there (also mirror apt/ for Pages).
      # Run on feature branches too so fixes reach the CDN without waiting for a manual master merge.
      - name: Publish deb to downloads/ + stable/ (fixed zhixiongfan.top source)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Sileo 固定源（无 @）— 必须是能直接返回 Packages 的地址。
          # zhixiongfan.top/stable 在 nginx 未配置前会 302 到 Dial，Sileo 会超时无法添加。
          # 域名配好后可再切；当前用 GitHub Pages（稳定可加源）。
          FIXED_SRC='https://zhixiongfan2018-web.github.io/ios-newdevice'
          DEB="$(ls dist/*.deb | head -n1)"
          DEB_NAME="$(basename "$DEB")"
          mkdir -p downloads stable/debs apt/debs
          rm -f downloads/com.local.newdevice_*.deb downloads/NewDevice.deb
          rm -f stable/debs/*.deb apt/debs/*.deb
          cp "$DEB" "downloads/$DEB_NAME"
          cp "$DEB" downloads/NewDevice.deb
          cp "$DEB" "stable/debs/$DEB_NAME"
          cp "$DEB" stable/debs/NewDevice.deb
          cp "$DEB" "apt/debs/$DEB_NAME"
          cp "$DEB" apt/debs/NewDevice.deb

          python3 - "$FIXED_SRC" "$DEB" <<'PY'
          import hashlib, datetime, sys, re, shutil
          from pathlib import Path
          fixed, deb_path = sys.argv[1], Path(sys.argv[2])
          data = deb_path.read_bytes()
          size = len(data)
          m = re.search(r'_(\d+\.\d+\.\d+-\d+)_', deb_path.name)
          ver = m.group(1) if m else '0'
          rev = int(datetime.datetime.now(datetime.timezone.utc).timestamp())
          packages = (
              "Package: com.local.newdevice\n"
              "Name: NewDevice\n"
              "Description: One-tap new device identity for Dopamine iOS 15-18 (incl. 18.x).\n"
              "Maintainer: Local Dev\n"
              "Author: Local Dev\n"
              "Section: Tweaks\n"
              f"Homepage: {fixed}/\n"
              "Architecture: iphoneos-arm64\n"
              f"Version: {ver}\n"
              "Installed-Size: 512\n"
              f"Filename: debs/{deb_path.name}\n"
              f"Size: {size}\n"
              f"MD5sum: {hashlib.md5(data).hexdigest()}\n"
              f"SHA1: {hashlib.sha1(data).hexdigest()}\n"
              f"SHA256: {hashlib.sha256(data).hexdigest()}\n"
              f"X-Rev: {rev}\n\n"
          )
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%a, %d %b %Y %H:%M:%S +0000')
          release = (
              f"Date: {now}\n"
              "Origin: NewDevice\n"
              "Label: NewDevice\n"
              "Suite: stable\n"
              "Version: 1.0\n"
              "Codename: stable\n"
              "Architectures: iphoneos-arm iphoneos-arm64\n"
              "Components: main\n"
              "Description: NewDevice Sileo source\n"
              f"Comment: ci-{rev}\n"
          )
          readme = f"# Sileo 固定源\n\n只用这一条：\n\n```\n{fixed}\n```\n"
          for root_name in ('stable', 'apt'):
              root = Path(root_name)
              root.mkdir(parents=True, exist_ok=True)
              (root / 'Packages').write_text(packages)
              pkg = (root / 'Packages').read_bytes()
              (root / 'Release').write_text(
                  release
                  + f"MD5Sum:\n {hashlib.md5(pkg).hexdigest()} {len(pkg)} Packages\n"
                  + f"SHA1:\n {hashlib.sha1(pkg).hexdigest()} {len(pkg)} Packages\n"
                  + f"SHA256:\n {hashlib.sha256(pkg).hexdigest()} {len(pkg)} Packages\n"
              )
              (root / '.jsdelivr_refresh').write_text(f'{rev}\n')
              (root / 'README.md').write_text(readme)
          print('stable+apt updated', ver, size)
          PY

          # Keep a simple landing page under stable/
          cat > stable/index.html <<HTML
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><title>NewDevice</title></head>
          <body><h1>NewDevice</h1><p>Sileo source:</p>
          <p><code>${FIXED_SRC}</code></p>
          <p><a href="debs/${DEB_NAME}">${DEB_NAME}</a></p></body></html>
          HTML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Snapshot published trees, then commit onto master (non-FF safe)
          rm -rf /tmp/nd-pub-stable /tmp/nd-pub-apt /tmp/nd-pub-dl
          cp -a stable /tmp/nd-pub-stable
          cp -a apt /tmp/nd-pub-apt
          cp -a downloads /tmp/nd-pub-dl
          git fetch origin master
          git stash push -u -m "pre-publish-stash" || true
          git checkout -B _publish-stable origin/master
          rm -rf stable apt downloads
          cp -a /tmp/nd-pub-stable stable
          cp -a /tmp/nd-pub-apt apt
          cp -a /tmp/nd-pub-dl downloads
          git add downloads/*.deb \
            stable/Packages stable/Release stable/.jsdelivr_refresh stable/README.md stable/index.html stable/debs/*.deb \
            apt/Packages apt/Release apt/.jsdelivr_refresh apt/README.md apt/debs/*.deb
          # Drop obsolete debs from index dirs
          git add -u stable/debs apt/debs downloads || true
          if git diff --cached --quiet; then
            echo "stable/apt/downloads already up to date"
          else
            # Do NOT use [skip ci] — Pages deploy (mirror only) watches stable/**
            git commit -m "Update stable Sileo source ${FIXED_SRC}"
            git push origin HEAD:master
          fi
          # Restore feature branch; keep dist/ from stash, drop published tree dirt
          git reset --hard
          git clean -fd
          git checkout -f "${GITHUB_REF_NAME}" || git checkout -f -
          git stash pop || true
          git checkout HEAD -- stable apt downloads 2>/dev/null || true
          mkdir -p dist
          if ! ls dist/*.deb >/dev/null 2>&1; then
            cp "/tmp/nd-pub-dl/${DEB_NAME}" "dist/${DEB_NAME}"
          fi
          git fetch origin master
          MASTER_SHA="$(git rev-parse origin/master)"

          # jsDelivr 无 @ 跟随 latest GitHub Release（semver）。必须比旧 tag 更大。
          TAG="v1.0.$(( ${{ github.run_number }} ))"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — retarget to master ${MASTER_SHA}"
            gh release delete "$TAG" --yes || true
            git push origin ":refs/tags/${TAG}" || true
          fi
          gh release create "$TAG" --target "$MASTER_SHA" --latest \
            --title "NewDevice ${DEB_NAME} (${TAG})" \
            --notes "Sileo 固定源：${FIXED_SRC}"
          # Optional jsDelivr mirror purge (official source is zhixiongfan.top — do not spam).
          curl -sS "https://purge.jsdelivr.net/gh/zhixiongfan2018-web/ios-newdevice" >/dev/null || true
          echo "Official Sileo source: ${FIXED_SRC}"
          echo "Verify GitHub raw (backend for zhixiongfan.top/stable):"
          curl -sS "https://raw.githubusercontent.com/zhixiongfan2018-web/ios-newdevice/master/stable/Packages" | head -n 20 || true


      - name: Build Sileo apt repo artifact
        run: |
          set -euo pipefail
          REPO_ROOT="$PWD/sileo-site"
          mkdir -p "$REPO_ROOT/debs"
          cp dist/*.deb "$REPO_ROOT/debs/"

          # Plain Packages only — do NOT publish Packages.gz/bz2 (CDN ghosts break Sileo)
          (
            cd "$REPO_ROOT"
            dpkg-scanpackages -m debs /dev/null > Packages
          )
          python3 - "$REPO_ROOT" <<'PY'
          import hashlib, datetime, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          pkg = (root / "Packages").read_bytes()
          size = len(pkg)
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")
          (root / "Release").write_text(
              f"Date: {now}\n"
              "Origin: NewDevice\n"
              "Label: NewDevice\n"
              "Suite: stable\n"
              "Version: 1.0\n"
              "Codename: stable\n"
              "Architectures: iphoneos-arm64\n"
              "Components: main\n"
              "Description: NewDevice Sileo source\n"
              f"MD5Sum:\n {hashlib.md5(pkg).hexdigest()} {size} Packages\n"
              f"SHA1:\n {hashlib.sha1(pkg).hexdigest()} {size} Packages\n"
              f"SHA256:\n {hashlib.sha256(pkg).hexdigest()} {size} Packages\n"
          )
          PY

          DEB_NAME=$(basename "$(ls dist/*.deb | head -n1)")
          cat > "$REPO_ROOT/index.html" <<HTML
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>NewDevice Sileo Source</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 2rem; line-height: 1.5; max-width: 40rem; }
              code, a { word-break: break-all; }
              .box { background: #f4f6f8; padding: 1rem 1.2rem; border-radius: 12px; }
            </style>
          </head>
          <body>
            <h1>NewDevice</h1>
            <p>Sileo 固定源（只用这一条）：</p>
            <p class="box"><code>https://zhixiongfan2018-web.github.io/ios-newdevice</code></p>
            <p>本页 deb：<a href="debs/${DEB_NAME}">${DEB_NAME}</a></p>
          </body>
          </html>
          HTML
          # Remove YAML-style leading indentation from generated HTML
          python3 -c "from pathlib import Path; p=Path('sileo-site/index.html'); p.write_text('\n'.join(l[2:] if l.startswith('  ') else l for l in p.read_text().splitlines())+'\n', encoding='utf-8')"

          ls -la "$REPO_ROOT" "$REPO_ROOT/debs"
          echo "----- Packages (head) -----"
          head -n 30 "$REPO_ROOT/Packages"
          echo "----- Release -----"
          cat "$REPO_ROOT/Release"

      - name: Upload Sileo site artifact
        uses: actions/upload-artifact@v4
        with:
          name: sileo-site
          path: sileo-site
          if-no-files-found: error
          retention-days: 14

  # GITHUB_TOKEN pushes to master do NOT trigger deploy-apt-pages.yml.
  # Deploy Pages here. No environment: filter — feature-branch builds must be allowed
  # (github-pages env often allows only master and then this job fails with 0 steps).
  deploy-pages:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master (published stable/)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Prepare site from stable/
        run: |
          set -euo pipefail
          rm -rf site
          cp -a stable site
          rm -f site/Packages.gz site/Packages.bz2 site/Packages.xz site/Packages.lzma site/Packages.zst
          test -f site/Packages
          test -f site/Release
          ls site/debs/com.local.newdevice_*.deb | head -n1 | grep -q .
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>NewDevice</title></head>
          <body>
            <h1>NewDevice</h1>
            <p>Sileo 固定源（只用这一条）：</p>
            <p><code>https://zhixiongfan2018-web.github.io/ios-newdevice</code></p>
            <p>域名 zhixiongfan.top/stable 需先配 nginx，否则会超时无法添加。</p>
          </body>
          </html>
          HTML
          echo "----- Packages -----"
          cat site/Packages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
